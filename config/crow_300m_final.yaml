# Final thesis run (crow-300m-final, 308M params, ~4.95B tokens over three stages), expressed for one local GPU.
#
# All step values are OPTIMIZER steps. One step = world_batch_size × block_size = 1024 × 2048 ≈ 2.1M tokens,
# so the three stages give 1573 + 715 + 71 = 2359 steps. The thesis ran with 64 micro-batches per step on 4 GPUs;
# on one GPU the same world batch is 256 micro-batches of 4, so a step takes correspondingly longer.
# (Old microbatch-step values ÷ 64: warmup 4096 → 64, cooldown 4096 → 64, resume_warmup 512 → 8,
#  save 8192 → 128, eval 1024 → 16.)
#
# Data: sources, per-stage token budgets/mixtures (3.3B + 1.5B + 0.15B tokens) and the tokenizer are defined in
# config/datasets/crow_300m_final.yaml. Training verifies the prepared data under dataset_dir and builds what is
# missing (`auto_prepare`); `python data_preparation/prepare.py build --dataset_config config/datasets/crow_300m_final.yaml`
# does the same up front (export HF_TOKEN for the gated peS2o source). The only per-stage value that stays here is
# the base learning rate (`stage_base_lrs`, positional, one per dataset-config stage).

run_name: crow-300m-final
out_dir: outputs
resume: true
seed: 233

model_name: crow-300m-final
block_size: 2048             # <= max_seq_length of the dataset config

dataset_config: config/datasets/crow_300m_final.yaml
dataset_dir: dataset
auto_prepare: true
prepare_num_workers: 4
stage_base_lrs: [3e-4, 1e-4, 5e-5]   # pretrain_phase1, pretrain_phase2, finetune

backend: single_device
precision: bf16-mixed
compile_model: true
gradient_checkpointing: false

micro_batch_size: 4
world_batch_size: 1024
dataloader_num_workers: 8
sort_batches_by_length: true
sequence_padding_multiple: 128

optimizer: ELLISAdam
optim_config:
  lr: 1e-4            # placeholder; the per-stage base_lr below is what the schedule uses
  weight_decay: 4e-5  # decoupled
  betas: [0.9, 0.95]
  update_clipping: true
  atan_adam: true
  running_init: true
  decouple_wd: true
no_weight_decay_for_bias_and_norm_params: true
grad_clip: 1.0
lr_schedule: trapezoid
warmup_steps: 64
cooldown_steps: 64
min_lr: 0
resume_warmup_steps: 8

log_step_interval: 1
log_gradient_metrics: true
eval_step_interval: 16
eval_iters: 50
partial_depth_eval: [1, 2, 4, 8, 16]
save_step_interval: 128
save_last_step: true
logger_project: recurtrain-baseline
wandb_offline: true
