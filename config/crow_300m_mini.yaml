# Real-data smoke run: the crow-300m-final model on config/datasets/crow_300m_mini.yaml (real Hub sources, a few
# hundred documents each, ~0.5 GB of downloads, builds in minutes; needs a Hub login for the gated mini-peS2o).
# 510k tokens over three stages at 8 × 2048 tokens per optimizer step -> ~30 steps; minutes on one 8 GB GPU.
# Everything not listed here follows config/crow_300m_final.yaml.

run_name: crow-300m-mini
out_dir: outputs
resume: false
seed: 233

model_name: crow-300m-final
block_size: 2048
dataset_config: config/datasets/crow_300m_mini.yaml
dataset_dir: dataset
auto_prepare: true
prepare_num_workers: 4
stage_base_lrs: [3e-4, 1e-4, 5e-5]

backend: single_device
precision: bf16-mixed
compile_model: false
gradient_checkpointing: true

micro_batch_size: 1
world_batch_size: 8
dataloader_num_workers: 2
sort_batches_by_length: true
sequence_padding_multiple: 128

optimizer: ELLISAdam
optim_config:
  lr: 1e-4
  weight_decay: 4e-5
  betas: [0.9, 0.95]
  update_clipping: true
  atan_adam: true
  running_init: true
  decouple_wd: true
no_weight_decay_for_bias_and_norm_params: true
grad_clip: 1.0
lr_schedule: trapezoid
warmup_steps: 4
cooldown_steps: 4
min_lr: 0
resume_warmup_steps: 2

log_step_interval: 1
log_gradient_metrics: true
eval_step_interval: 10
eval_iters: 2
partial_depth_eval: [1, 4]
save_step_interval: 100
save_last_step: true
logger_project: recurtrain-smoke
wandb_offline: true
wandb_enabled: false
