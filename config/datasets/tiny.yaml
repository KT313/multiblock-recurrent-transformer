# Synthetic dataset for the smoke run (config/tiny.yaml) and the tests: a hand-written WordLevel tokenizer
# (<pad>, <bos>, <eos>, tok_0..tok_255) and random-word documents generated on demand. Builds in seconds, no
# network. `python data_preparation/prepare.py prepare --dataset_config config/datasets/tiny.yaml`.

tokenizer: {name: synthetic, kind: synthetic}
dataset_max_sequence_length: 256
token_count: tokenizer
validation_fraction: 0.05       # every source below is used for training and validation: its first 5 % of rows are held out

processing:
  min_chars: 1
  dedup: {mode: exact, normalize: true, bloom_memory_mb: 1}   # tiny filter: the smoke dataset has a few thousand rows

sources:
  synthetic_pretrain: {kind: pretrain, loader: synthetic, seed: 0, describe_tokens_per_row: 224}
  synthetic_instruct: {kind: instruct, loader: synthetic, seed: 2, input_inversions: 0.1, describe_tokens_per_row: 64}

stages:
  - {name: pretrain_a, tokens: 8192, transition_pct: 0.25, train: {synthetic_pretrain: 1.0}, val: {synthetic_pretrain: 1.0}}
  - {name: pretrain_b, tokens: 8192, transition_pct: 0.25, train: {synthetic_pretrain: 1.0}, val: {synthetic_pretrain: 1.0}}
  - {name: finetune,   tokens: 4096, transition_pct: 0.0,  train: {synthetic_instruct: 1.0}, val: {synthetic_instruct: 1.0}}
