# Local dev/smoke-test environment (uv). Not the training environment:
# the cluster env is defined by code/recurrent-pretraining/pyproject.toml
# (torch 2.2/2.4, axonn, lm-eval, ...). This trimmed env only needs to
# support import checks and tiny forward passes on a laptop GPU/CPU.
[project]
name = "multiblock-recurrent-pretraining-dev"
version = "0.1"
requires-python = ">=3.11"
dependencies = [
  # sm_120 (RTX 5070) needs >=2.7; <2.11 because recpre/checkpoint_patch.py
  # imports torch.utils.checkpoint privates (_NoopSaveInputs, ...) that were
  # removed by torch 2.13 (verified present through 2.10)
  "torch>=2.7,<2.11",
  "numpy<2.0",
  "einops",
  "lightning>=2.3,<2.6",
  "jsonargparse[signatures]>=4.27.6",
  "torchmetrics>=1.3.1",
  "wandb",
  "sentencepiece>=0.2.0",
  "tokenizers>=0.15.2",
  "safetensors>=0.4.3",
  "datasets>=2.18.0",
  "transformers>=4.38.0",
  "pandas",
  "requests>=2.31.0",
  "packaging",
  "torchdata>=0.8",      # train.py: StatefulDataLoader
]

[tool.uv]
package = false
