# Training smoke run: the real train.py code path with a tiny model.
#
# 3 stages mirroring the thesis curriculum shape (pretrain a/b + finetune),
# ~20 optimizer steps total on synthetic data, single GPU, a few seconds of
# compute. Evals run mid-training (eval_step_interval) and automatically at the
# final step; a checkpoint is saved at the end (save_last_step). Pass criterion:
# the run exits 0. Launch via tests/train_smoke/run.sh (from the repo root).
#
# Based on code/cluster/configs/multistage_test_small.yaml.

enable_multi_stage: true

# tokens per optimizer step = world_batch_size 4 x block_size 256 = 1024
training_stages:
  - name: "pretrain_a"
    tokens: 8192            # ~8 steps
    base_lr: 3e-4
    transition_pct: 0.25    # exercise the stage-transition logic
    train_data:
      - type: hfds
        prefix: pretrain-train
        data_dir: tests/train_smoke/data/pretrain/train
        weight: 1.0
    val_data:
      - type: hfds
        prefix: pretrain-val
        data_dir: tests/train_smoke/data/pretrain/val
        weight: 1.0

  - name: "pretrain_b"
    tokens: 8192            # ~8 steps
    base_lr: 1e-4
    transition_pct: 0.25
    train_data:
      - type: hfds
        prefix: pretrain-train
        data_dir: tests/train_smoke/data/pretrain/train
        weight: 1.0
    val_data:
      - type: hfds
        prefix: pretrain-val
        data_dir: tests/train_smoke/data/pretrain/val
        weight: 1.0

  - name: "finetune"
    tokens: 4096            # ~4 steps
    base_lr: 5e-5
    transition_pct: 0.0
    train_data:
      - type: hfds
        prefix: finetune-train
        data_dir: tests/train_smoke/data/finetune/train
        weight: 1.0
    val_data:
      - type: hfds
        prefix: finetune-val
        data_dir: tests/train_smoke/data/finetune/val
        weight: 1.0

# Main settings
run_name: tiny-train-smoke
resume: False
seed: 42

# The real final-run architecture, shrunk to ~240K params via model_overwrite
# (model_overwrite entries are passed straight into Config.from_name)
model_name: crow-300m-final
model_impl: dynamic
block_size: 256
fabric_precision: bf16-mixed
model_overwrite:
  attn_impl: sdpa           # no flash-attn on the laptop
  n_embd: 64
  intermediate_size: 128
  num_attention_heads: 4
  num_key_value_heads: 4
  vocab_size: 512           # tokenizer has 259 tokens; 512 leaves padding room
  padding_multiple: 512
  block_size: 256
  n_layers_in_recurrent_block: [1, 1]
  mean_recurrence: 2
  mean_backprop_depth: 2
  n_layers_in_prelude: 2    # keeps the (preserved) prelude non-chaining path active
  n_layers_in_coda: 1

dataloader_num_workers: 2
measure_utilization: False
model_telemetry: False

# Training hyperparameters
micro_batch_size: 2
world_batch_size: 4         # -> 2 gradient-accumulation steps on 1 GPU
batch_size_ramp: 0

optimizer: AdamW
optim_config:
  lr: 3e-4
  weight_decay: 0.1
  betas:
    - 0.9
    - 0.95

min_lr: 0
warmup_steps: 2
lr_schedule: constant
cooldown_steps: 2
grad_clip: 1.0

# Implementation
fabric_strategy: single
compile_model: False
gradient_checkpointing: False

# Logging (wandb is the only supported logger; run.sh sets WANDB_MODE=offline)
logger_project: "train-smoke"
logger_name: wandb
log_step_interval: 1
save_step_interval: 100     # no mid-run saves; the final save comes from save_last_step
eval_step_interval: 8       # mid-run evals at steps 8 and 16, plus the automatic final eval
eval_iters: 2
save_last_step: True

all_block_size_tensors: True
pad_to_block_size: False
sequence_padding_multiple: 128

tokenizer_path: tests/train_smoke/data/tokenizer
