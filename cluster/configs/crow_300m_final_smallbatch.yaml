# Small-batch comparison run (world_batch 64, single device, run 120) - batch-size ablation.

# Main settings
# run_name: raven_small_test_3recs_add_run
max_tokens: 2_125_000_000 # informational; with enable_multi_stage the actual budget is the sum of training_stages tokens

# resuming previous run
resume: true # true
resume_checkpoint_path: /path/to/fast_storage/recpre/outputs/120/checkpoints-SingleDeviceStrategy/step-00164794-recur1b-mig-120-stage-0_end # /path/to/fast_storage/recpre/outputs/52/checkpoints-SingleDeviceStrategy/step-00173949-recur1b-mig-52-stage-0_end
run_name: crow-300m-final-120 # recur1b-mig-52
out_dir: /path/to/fast_storage/recpre/outputs

seed: 233
# out_dir: /lustre/orion/csc569/proj-shared/recllm_runs/baseline/

# Model configuration
model_name: crow-300m-final
model_impl: dynamic
block_size: 2048
fabric_precision: bf16-mixed
model_overwrite:
  attn_impl: sdpa # tridao # this assumes that the AMD fork of the repo is installed, as in the install guide
  use_fused_head: pytorch
#   mup_model_scaling_factor: 1
#   lockstep_n: True
#   lockstep_k: True
#   mean_recurrence: 1
#   mean_backprop_depth: 1
#   sampling_scheme: non-recurrent

dataloader_num_workers: 8
measure_utilization: False # True
model_telemetry: True # True # True # telemetry on attention turned off for now

# Training hyperparameters
micro_batch_size: 4 # 2 #
world_batch_size: 64 # 4096 # up to 16mil token
batch_size_ramp: 0 # no room ...
# sort_batches_by_length: True

optimizer: ELLISAdam
optim_config:
  lr: 1e-4
  weight_decay: 4e-5 # decoupled!
  betas:
    - 0.9
    - 0.95 # conservative
  # eps: 1e-8 # removed as a factor
  update_clipping: True
  atan_adam: True
  running_init: True
  tensor_wise_finite_check: False # True is a recipe for wasting compute
  tensor_wise_gradient_normalization: False
  decouple_wd: True

min_lr: 0
warmup_steps: 4096 # this is ~6.8% warmup ##### world-size dependent #####
lr_schedule: trapezoid
cooldown_steps: 4096 # ~6.8% cooldown percentage ##### world-size dependent #####
no_weight_decay_for_bias_and_norm_params: True
grad_clip: 1.0

# Regularization
z_regularization: 0

# Implementation and backend
fabric_strategy: single # simple-ddp # fsdp-hybrid2 broken
# devices: 2
# num_nodes: 1
fabric:
  optim_sharding: True
compile_model: True
dynamo_ddp_config: python_reducer # ddp_optimizer # python_reducer
gradient_checkpointing: False # not the worst with SAC-attn
loss_guardrail_active: False
skip_nonfinite_grads: False
fail_instead_of_recompile: False # turn this on for large-node setups

# Logging
logger_project: "recurtrain-baseline"
logger_name: wandb
shape_watching_steps: 0
log_step_interval: 32 # every 30 secs
save_step_interval: 8192 # 15 minutes  ##### world-size dependent #####
eval_step_interval: 1024 # 15 minutes? ##### world-size dependent #####
eval_iters: 50 # validation is distributed
save_n_min_before_job_done: 5 # maybe we're brave enough for a 5min interval
save_last_step: True

partial_depth_eval: [1, 2, 4, 8, 16]

# Data Handling
all_block_size_tensors: True
pad_to_block_size: False  # Use sequence_padding_multiple instead for better efficiency
sequence_padding_multiple: 128  # Pad to nearest multiple of 128 (e.g., 200 tokens → 256, 500 → 512)

tokenizer_path: /path/to/shared_storage/recpre/artifacts/tokenizer_llama32k

# Enable multi-stage training
enable_multi_stage: true

# Define training stages
training_stages:
  # Stage 0: Pretraining Phase 1 - Broad pretraining (80% of total tokens)
  - name: "pretrain_phase1"
    tokens: 1_300_000_000
    base_lr: 3e-4
    transition_pct: 0.0  # 5% of phase 1 tokens for transition to phase 2
    train_data:
      # Web & General (71%)
      - type: hfds
        prefix: fineweb-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/fineweb_edu
        weight: 0.65
      - type: hfds
        prefix: wikipedia-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/wikipedia
        weight: 0.09
      - type: hfds
        prefix: books-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/books_gutenberg
        weight: 0.06

      # Code (12% total, split by language)
      - type: hfds
        prefix: code-py-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_python
        weight: 0.036
      - type: hfds
        prefix: code-js-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_javascript
        weight: 0.024
      - type: hfds
        prefix: code-ts-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_typescript
        weight: 0.012
      - type: hfds
        prefix: code-java-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_java
        weight: 0.012
      - type: hfds
        prefix: code-cpp-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_cpp
        weight: 0.0096
      - type: hfds
        prefix: code-go-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_go
        weight: 0.0084
      - type: hfds
        prefix: code-rust-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_rust
        weight: 0.006
      - type: hfds
        prefix: code-shell-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_shell
        weight: 0.0048
      - type: hfds
        prefix: code-sql-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_sql
        weight: 0.0036
      - type: hfds
        prefix: code-html-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_html
        weight: 0.0036

      # Academic & Math (8%)
      - type: hfds
        prefix: peso-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/peso
        weight: 0.03
      - type: hfds
        prefix: arxiv-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/arxiv
        weight: 0.02
      - type: hfds
        prefix: math-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/openwebmath
        weight: 0.03

    val_data:
      - type: hfds
        prefix: fw-val-1
        data_dir: /path/to/shared_storage/recpre/datasets/fineweb-edu/validation
        weight: 1.0

  # Stage 1: Pretraining Phase 2 - Domain upsampling (20% of total tokens)
  - name: "pretrain_phase2"
    tokens: 750_000_000
    base_lr: 1e-4
    transition_pct: 0.0  # 10% of phase 2 tokens for transition to finetuning
    train_data:
      # Web content (35%)
      - type: hfds
        prefix: fineweb2-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/fineweb_edu
        weight: 0.35

      # Code (28% total, split by language)
      - type: hfds
        prefix: code2-py-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_python
        weight: 0.084
      - type: hfds
        prefix: code2-js-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_javascript
        weight: 0.056
      - type: hfds
        prefix: code2-ts-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_typescript
        weight: 0.028
      - type: hfds
        prefix: code2-java-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_java
        weight: 0.028
      - type: hfds
        prefix: code2-cpp-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_cpp
        weight: 0.0224
      - type: hfds
        prefix: code2-go-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_go
        weight: 0.0196
      - type: hfds
        prefix: code2-rust-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_rust
        weight: 0.014
      - type: hfds
        prefix: code2-shell-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_shell
        weight: 0.0112
      - type: hfds
        prefix: code2-sql-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_sql
        weight: 0.0084
      - type: hfds
        prefix: code2-html-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/github_code_clean_html
        weight: 0.0084

      # Math mixture (22% total)
      - type: hfds
        prefix: math2-owm-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/openwebmath
        weight: 0.088
      - type: hfds
        prefix: math2-gsm-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/tinygsm
        weight: 0.066
      - type: hfds
        prefix: math2-alg-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/algebraic_stack
        weight: 0.044
      - type: hfds
        prefix: math2-gsm8k-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/gsm8k
        weight: 0.022

      # Academic papers (15% total)
      - type: hfds
        prefix: peso2-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/peso
        weight: 0.09
      - type: hfds
        prefix: arxiv2-train
        data_dir: /path/to/shared_storage/recpre/datasets/pretraining_300m/processed/merged/arxiv
        weight: 0.06

    val_data:
      - type: hfds
        prefix: fw2-val
        data_dir: /path/to/shared_storage/recpre/datasets/fineweb-edu/validation
        weight: 1.0

  # Stage 2: Finetuning
  - name: "finetune"
    tokens: 75_000_000
    base_lr: 5e-5
    transition_pct: 0.0  # No transition after finetuning (last stage)
    train_data:
      - type: hfds
        prefix: flan-mixture-train
        data_dir: /path/to/shared_storage/recpre/datasets/flan_mixture_no_chat_template/train
        weight: 1.0
        data_signature:
          keys: ["instruction", "input", "output"]
          format_fn: "concatenate_instruction_input_output"

    val_data:
      - type: hfds
        prefix: flan-mixture-val
        data_dir: /path/to/shared_storage/recpre/datasets/flan_mixture_no_chat_template/validation
        weight: 1.0
        data_signature:
          keys: ["instruction", "input", "output"]
          format_fn: "concatenate_instruction_input_output"

