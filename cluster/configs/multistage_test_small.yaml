# Multi-Stage Training - Small Test Configuration
#
# This is a minimal config for testing multi-stage training functionality
# Uses very small token counts for quick iteration and validation

enable_multi_stage: true

training_stages:
  # Stage 0: Short pretraining phase 1
  - name: "pretrain_test1"
    tokens: 1_000_000  # 1M tokens (~122 steps with bs=4, seq=2048)
    base_lr: 3e-4
    transition_pct: 0.1  # 10% transition (larger for testing)
    train_data:
      - type: hfds
        prefix: test1-train
        data_dir: /path/to/shared_storage/recpre/datasets/fineweb-edu/train
        weight: 1.0
    val_data:
      - type: hfds
        prefix: test1-val
        data_dir: /path/to/shared_storage/recpre/datasets/fineweb-edu/validation
        weight: 1.0

  # Stage 1: Short pretraining phase 2
  - name: "pretrain_test2"
    tokens: 1_000_000  # 1M tokens
    base_lr: 1e-4
    transition_pct: 0.1
    train_data:
      - type: hfds
        prefix: test2-train
        data_dir: /path/to/shared_storage/recpre/datasets/fineweb-edu/train
        weight: 1.0
    val_data:
      - type: hfds
        prefix: test2-val
        data_dir: /path/to/shared_storage/recpre/datasets/fineweb-edu/validation
        weight: 1.0

  # Stage 2: Short finetuning
  - name: "finetune_test"
    tokens: 500_000  # 500K tokens
    base_lr: 5e-5
    transition_pct: 0.0
    train_data:
      - type: hfds
        prefix: test3-train
        data_dir: /path/to/shared_storage/recpre/datasets/flan_mixture_v1/train
        weight: 1.0
    val_data:
      - type: hfds
        prefix: test3-val
        data_dir: /path/to/shared_storage/recpre/datasets/flan_mixture_v1/val
        weight: 1.0

# Main settings
run_name: multistage_test_small
resume: False
seed: 42

# Model configuration - use smallest model for fast testing
model_name: nebel-raven-small-test-3recs-add
model_impl: dynamic
block_size: 2048
fabric_precision: bf16-mixed
model_overwrite:
  attn_impl: sdpa

dataloader_num_workers: 4
measure_utilization: False
model_telemetry: False

# Training hyperparameters
micro_batch_size: 4
world_batch_size: 32
batch_size_ramp: 0

optimizer: AdamW
optim_config:
  lr: 3e-4
  weight_decay: 0.1
  betas:
    - 0.9
    - 0.95

min_lr: 0
warmup_steps: 10  # Small warmup for testing
lr_schedule: constant
cooldown_steps: 10  # Small cooldown for testing
grad_clip: 1.0

# Implementation
fabric_strategy: single
compile_model: False  # Disable for faster testing
gradient_checkpointing: False

# Logging - frequent for testing
logger_project: "recurtrain-test"
logger_name: wandb
log_step_interval: 5
save_step_interval: 50
eval_step_interval: 50
eval_iters: 10
save_last_step: True

all_block_size_tensors: True
pad_to_block_size: False
sequence_padding_multiple: 128

tokenizer_path: /path/to/shared_storage/recpre/artifacts/tokenizer_llama32k

# Expected behavior with this config:
# - Total tokens: 2.5M (1M + 1M + 500K)
# - Approximate steps: ~305 total
# - Stage 1: steps 0-122 (transition starts ~step 110)
# - Stage 2: steps 122-244 (transition starts ~step 232)
# - Stage 3: steps 244-305
# - Checkpoints saved before transitions (around steps 109, 231)
# - Should complete in a few minutes on A100
