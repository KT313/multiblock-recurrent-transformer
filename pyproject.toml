[project]
name = "multiblock-recurrent-transformer"
version = "0.2.0"
description = "Multi-block depth-recurrent transformer: model, single-GPU training, data preparation"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  # torch>=2.7 for sm_120 GPUs; keep in sync with the GPU driver on the machine
  "torch>=2.7",
  "numpy<2.0",
  "pyarrow>=15",
  "transformers>=4.45",
  "tokenizers>=0.20",
  "safetensors>=0.4.3",
  "jsonargparse[signatures]>=4.27.6",
  "wandb",
  "tqdm",
]

[project.optional-dependencies]
# dataset download / preprocessing (data_preparation/)
data = [
  "datasets>=2.18.0",
  "datasketch",
  "ijson>=3.5.1",
  "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-timeout",
  "ruff",
  "mypy",
  "basedpyright",
  "pandas-stubs",
  "types-tqdm",
  "pyarrow-stubs",
  "types-pyyaml>=6.0.12.20260815",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["model", "training", "data_preparation"]
pythonpath = ["."]
markers = [
  "gpu: needs a CUDA device (skipped otherwise)",
  "slow: takes more than ~10 s",
]
addopts = "-q"
timeout = 600

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".git", "__pycache__", ".venv", "outputs", "dataset"]

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "PLC", "G", "PIE", "SIM", "W"]
ignore = ["E501", "E731", "E741", "B008", "B905", "SIM108", "C408", "G004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
files = ["model", "training", "data_preparation", "conftest.py"]
exclude = ["\\.venv/", "outputs/", "dataset/"]
strict = true
warn_unreachable = true
# third-party packages without (complete) stubs
[[tool.mypy.overrides]]
module = ["transformers.*", "datasets.*", "datasketch.*", "ijson.*", "wandb.*", "jsonargparse.*", "safetensors.*", "tqdm.*"]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.11"
include = ["model", "training", "data_preparation", "conftest.py"]
exclude = ["**/__pycache__", ".venv", "outputs", "dataset"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingModuleSource = false
