[project]
name = "multiblock-recurrent-transformer"
version = "0.2.0"
description = "Multi-block depth-recurrent transformer: model, single-GPU training, data preparation"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  # torch>=2.7 for sm_120 GPUs; keep in sync with the GPU driver on the machine
  "torch>=2.7",
  "numpy<2.0",
  "pyarrow>=15",
  # transformers>=5.0: the HF wrapper declares `_tied_weights_keys` in the 5.x {target: source} mapping form
  "transformers>=5.0",
  "tokenizers>=0.20",
  "safetensors>=0.4.3",
  "jsonargparse[signatures]>=4.49",
  "wandb",
  "rich>=13",
  "rbloom>=1.5.4",
  "pyyaml",           # model/config.py reads the architecture YAML
  "huggingface_hub",  # data_preparation/lib/sources/hub_files.py lists repo files
]

[project.optional-dependencies]
# dataset download / preprocessing (data_preparation/)
data = [
  "datasets>=2.18.0",
  "datasketch",
  "ijson>=3.5.1",
  "zstandard>=0.25.0",
]
# benchmark evaluation (evaluation/benchmarks.py)
eval = [
  "lm_eval[hf]>=0.4.8",  # [hf]: accelerate, which lm_eval.models.huggingface imports (the HFLM the benchmarks run on)
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-timeout",
  "pytest-xdist",
  "ruff",
  "mypy",
  "basedpyright",
  "pandas-stubs",
  "pyarrow-stubs",
  "types-pyyaml>=6.0.12.20260815",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q -rs -n 8 --dist loadgroup"  # -rs names every skipped test and its reason; eight workers (about 3 GB each at peak, 3 cores each); -n 0 runs serially
testpaths = ["model", "training", "data_preparation", "ui", "evaluation"]
pythonpath = ["."]
markers = [
  "gpu: needs a CUDA device (skipped otherwise)",
  "slow: takes more than ~10 s",
]
timeout = 600
# pytest's default list contains "build", which would silently skip data_preparation/lib/build/test_*.py
norecursedirs = [".*", "*.egg", "dist", "node_modules", "venv", ".venv", "dataset", "outputs"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".git", "__pycache__", ".venv", ".claude", "outputs", "dataset"]

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "PLC", "G", "PIE", "SIM", "W"]
ignore = ["E501", "E731", "E741", "B008", "B905", "SIM108", "C408", "G004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
files = ["model", "training", "data_preparation", "ui", "evaluation", "conftest.py"]
exclude = ["\\.venv/", "\\.claude/", "outputs/", "dataset/"]
strict = true
warn_unreachable = true
# third-party packages without (complete) stubs
[[tool.mypy.overrides]]
module = ["transformers.*", "datasets.*", "datasketch.*", "ijson.*", "wandb.*", "jsonargparse.*", "safetensors.*", "lm_eval.*"]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.11"
include = ["model", "training", "data_preparation", "ui", "evaluation", "conftest.py"]
exclude = ["**/__pycache__", ".venv", ".claude", "outputs", "dataset"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingModuleSource = false
